[defaults]
inventory          = inventory/hosts.yml
roles_path         = roles
remote_user        = root
host_key_checking  = False
interpreter_python = auto_silent
forks              = 10
# Muestra al final el tiempo de cada tarea (evidencia de "Improve time response")
callbacks_enabled  = ansible.posix.profile_tasks
# Opcional: descomentar para no escribir la contrasena del vault cada vez
# vault_password_file = .vault_pass

[ssh_connection]
# Reutiliza la conexion SSH y envia los modulos por la misma sesion
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
